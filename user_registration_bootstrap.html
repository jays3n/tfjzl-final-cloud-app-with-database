<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"></head><body><main class="container mt-5"><h1>Create account</h1>{% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="form-group"><label for="username">Username</label><input class="form-control" id="username" name="username" required></div><div class="form-group"><label for="firstname">First name</label><input class="form-control" id="firstname" name="firstname"></div><div class="form-group"><label for="lastname">Last name</label><input class="form-control" id="lastname" name="lastname"></div><div class="form-group"><label for="psw">Password</label><input class="form-control" type="password" id="psw" name="psw" required></div><button class="btn btn-primary" type="submit">Register</button><a class="btn btn-link" href="{% url 'onlinecourse:login' %}">Login</a></form></main></body></html>
